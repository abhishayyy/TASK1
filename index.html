<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .profile-card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            text-align: center;
        }
        .profile-card h1 {
            margin: 10px 0;
            color: #333;
        }
        .profile-card p {
            color: #666;
            line-height: 1.6;
        }
        .skills {
            list-style-type: none;
            padding: 0;
        }
        .skills li {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h1>John Doe</h1>
        <p><strong>Student & Web Developer</strong></p>
        <p>Hi! I'm passionate about learning new technologies, building web applications, and mastering version control with Git.</p>
        
        <h3>Skills</h3>
        <ul class="skills">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>Git</li>
        </ul>
    </div>

</body>
</html>
